<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>문고은 포트폴리오</title>
<style>html,body{margin:0;min-height:100%;background:#0b0b0d;color:#f2f0eb;font-family:system-ui,sans-serif;display:grid;place-items:center}#status{font-size:14px;letter-spacing:.04em;opacity:.65}</style>
</head>
<body>
<div id="status">포트폴리오를 불러오는 중입니다…</div>
<script>
var bannerAssetId="2968fe98-ac20-4297-b67d-ff23e654bb08";
var oldBannerMarkup=String.raw`<img src=\"${bannerAssetId}\" alt=\"센터 외벽 현수막 적용\" style=\"width:100%;aspect-ratio:1/2;object-fit:contain;display:block;background:#e9e6df\">`;
var newBannerMarkup=String.raw`<div style=\"position:relative;width:100%;aspect-ratio:1/2;background:#e9e6df\"><img src=\"${bannerAssetId}\" alt=\"센터 외벽 현수막 적용\" style=\"width:100%;height:100%;object-fit:contain;display:block;background:#e9e6df\"><span aria-hidden=\"true\" style=\"position:absolute;left:61.1%;top:15.55%;width:22.2%;height:2.05%;border-radius:999px;background:linear-gradient(90deg,#fbf5ec 0%,#fbf4eb 52%,#fbf5ed 100%);box-shadow:0 0 2px 1px rgba(251,244,235,.72);pointer-events:none\"></span></div>`;
fetch("https://raw.githubusercontent.com/moongoeun10-dotcom/moongoeun10-dotcom.github.io/8261c98050713a34e894edbeb75a0a3b67f5b6de/%EB%AC%B8%EA%B3%A0%EC%9D%80-%ED%8F%AC%ED%8A%B8%ED%8F%B4%EB%A6%AC%EC%98%A4%20%282%29.html")
.then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.text()})
.then(function(html){if(!html.includes(oldBannerMarkup))throw new Error("Target banner markup not found");html=html.replace(oldBannerMarkup,newBannerMarkup);document.open();document.write(html);document.close()})
.catch(function(){document.getElementById("status").textContent="포트폴리오를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요."});
</script>
</body>
</html>
